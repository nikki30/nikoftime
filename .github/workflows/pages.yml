name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # daily, so My Roamin' Empire has this week's hits and today's news

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Fetch this week's top songs for My Roamin' Empire
        continue-on-error: true
        timeout-minutes: 8
        run: node tools/charts.mjs
      - name: Fetch today's headlines for My Roamin' Empire
        continue-on-error: true
        timeout-minutes: 6
        run: node tools/news.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
