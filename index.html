<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nikoftime</title>
  <meta name="description" content="Little apps you can use right now. No sign-ups, no installs: click a tile and play.">
  <meta property="og:title" content="nikoftime">
  <meta property="og:description" content="Little apps you can use right now. Click a tile and play.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#fbf7ef">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..100,0..1&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button class="theme-toggle" type="button" aria-label="Switch between light and dark">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
  </button>

  <main>
    <header class="masthead">
      <h1 class="wordmark" aria-label="nikoftime">
        <button class="word" type="button" title="Go on, click me">
          <span>n</span><span>i</span><span>k</span><span>o</span><span>f</span><span>t</span><span>i</span><span>m</span><span>e</span>
        </button>
      </h1>
      <p class="tagline">Little apps you can use right now.<br><span>No sign-ups, no installs. Click a tile and play.</span></p>
    </header>

    <!--
      Each tile is one app. To add another, copy an <a class="tile"> block,
      change href, the title, the blurb and --tile (its colour), and draw new art.
    -->
    <section class="grid" aria-label="Apps">
      <a class="tile" href="do-not-fret/" style="--tile:#5f7a3a; --tile-2:#c7d4a6">
        <div class="art" aria-hidden="true">
          <svg viewBox="0 0 400 300">
            <defs>
              <linearGradient id="dnf-sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#e9efd6"/><stop offset="1" stop-color="#cfdcae"/>
              </linearGradient>
              <linearGradient id="dnf-wood" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#4a2a1d"/><stop offset="1" stop-color="#2e1a12"/>
              </linearGradient>
            </defs>
            <rect width="400" height="300" fill="url(#dnf-sky)"/>
            <circle cx="330" cy="62" r="34" fill="#f2c14e" opacity=".9"/>
            <g class="floaters" fill="#2f4a22">
              <text class="f1" x="70" y="82" font-size="34">♪</text>
              <text class="f2" x="150" y="58" font-size="26">♫</text>
              <text class="f3" x="250" y="96" font-size="30">♪</text>
            </g>
            <g transform="rotate(-8 200 190)">
              <rect x="-20" y="138" width="440" height="108" rx="6" fill="url(#dnf-wood)"/>
              <g stroke="#d9c49a" stroke-width="3">
                <line x1="40" y1="138" x2="40" y2="246"/><line x1="120" y1="138" x2="120" y2="246"/>
                <line x1="200" y1="138" x2="200" y2="246"/><line x1="280" y1="138" x2="280" y2="246"/>
                <line x1="360" y1="138" x2="360" y2="246"/>
              </g>
              <circle cx="160" cy="192" r="6" fill="#e8dcc0" opacity=".7"/><circle cx="320" cy="192" r="6" fill="#e8dcc0" opacity=".7"/>
              <g class="strings" stroke="#f5ecd6" stroke-linecap="round">
                <line class="s1" x1="-20" y1="148" x2="420" y2="148" stroke-width="1.2"/>
                <line class="s2" x1="-20" y1="167" x2="420" y2="167" stroke-width="1.6"/>
                <line class="s3" x1="-20" y1="186" x2="420" y2="186" stroke-width="2"/>
                <line class="s4" x1="-20" y1="205" x2="420" y2="205" stroke-width="2.4"/>
                <line class="s5" x1="-20" y1="224" x2="420" y2="224" stroke-width="2.8"/>
                <line class="s6" x1="-20" y1="241" x2="420" y2="241" stroke-width="3.2"/>
              </g>
              <g class="dots" font-family="DM Sans, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
                <g class="d1"><circle cx="80" cy="241" r="13" fill="#e2a63b"/><text x="80" y="245.5" fill="#2b1a10">A</text></g>
                <g class="d2"><circle cx="160" cy="224" r="13" fill="#f5ecd6"/><text x="160" y="228.5" fill="#2b1a10">E</text></g>
                <g class="d3"><circle cx="240" cy="205" r="13" fill="#f5ecd6"/><text x="240" y="209.5" fill="#2b1a10">G</text></g>
                <g class="d4"><circle cx="160" cy="186" r="13" fill="#e2a63b"/><text x="160" y="190.5" fill="#2b1a10">A</text></g>
                <g class="d5"><circle cx="240" cy="167" r="13" fill="#f5ecd6"/><text x="240" y="171.5" fill="#2b1a10">D</text></g>
                <g class="d6"><circle cx="320" cy="148" r="13" fill="#f5ecd6"/><text x="320" y="152.5" fill="#2b1a10">G</text></g>
              </g>
            </g>
          </svg>
        </div>
        <div class="label">
          <h2>Do Not Fret</h2>
          <p>Learn guitar, twenty minutes a day</p>
        </div>
      </a>
    </section>

    <p class="soon"><span aria-hidden="true">✦</span> More tiles are on the way <span aria-hidden="true">✦</span></p>
  </main>

  <footer>
    <span>Made by Nikita Sivakumar</span>
    <a href="https://github.com/nikki30" rel="noopener">GitHub</a>
    <a href="mailto:hello@nikitasivakumar.com">Say hi</a>
  </footer>

  <script src="main.js" defer></script>
</body>
</html>
